name: Deploy

on:
  push:
    branches: [main]

concurrency:
  # Ensure only a single deployment occurs at any given time.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
          cache: true
          run_install: true

      # The restored pnpm store skips puppeteer's postinstall, which downloads
      # Chrome outside the store.
      - name: Install Chrome
        run: pnpm rebuild puppeteer

      # For glyphhanger
      - name: Install fonttools
        run: pip3 install fonttools[woff]

      - name: Build
        run: pnpm build
        env:
          SITE_URL: https://tomeraberba.ch
          FONTCONFIG_PATH: private/fonts
          PANGOCAIRO_BACKEND: fontconfig

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
